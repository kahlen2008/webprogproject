<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up | Recipe Planner</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="container">
    <section class="auth-card">
      <h1>Create your account</h1>
      <form id="signup-form" novalidate>
        <div class="form-field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label for="password">Password (at least 6 characters)</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
        </div>
        <p class="form-error" role="alert"></p>
        <button class="btn btn-block" type="submit">Sign up</button>
        <!-- TODO (Person 1): live validation, show/hide password, Google sign-in -->
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script type="module" src="js/navbar.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
