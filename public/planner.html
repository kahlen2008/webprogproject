<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal Planner | RecipePlan</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS v3 via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#ca5c2e',
              dark: '#b34d23',
              light: '#fdf8f4',
              surface: '#faf6f0',
              cream: '#faf7f2',
              pill: '#f5ebe4',
              pillText: '#a04e28',
              border: '#ede4da',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Outfit', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/planner.css">
</head>
<body class="bg-[#faf7f2] text-stone-800 min-h-screen flex flex-col font-sans antialiased">
  <header id="navbar" class="w-full sticky top-0 z-40"></header>

  <main class="flex-1 max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 md:py-10 space-y-6">
    
    <!-- Planner Header & Toolbar -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-stone-900 tracking-tight">Weekly Meal Plan</h1>

      <!-- Date Range Navigator -->
      <div class="inline-flex items-center gap-3 bg-white px-3 py-1.5 rounded-2xl border border-[#efe6dc] shadow-xs">
        <button id="prev-week-btn" type="button" class="p-1 rounded-lg text-stone-400 hover:text-stone-800 hover:bg-stone-100 transition focus:outline-none" aria-label="Previous week">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span id="week-label" class="text-xs sm:text-sm font-semibold text-stone-700 select-none">23 Nov – 29 Nov 2026</span>
        <button id="next-week-btn" type="button" class="p-1 rounded-lg text-stone-400 hover:text-stone-800 hover:bg-stone-100 transition focus:outline-none" aria-label="Next week">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
      </div>

      <!-- Action Button -->
      <div>
        <button id="generate-plan-btn" type="button" class="inline-flex items-center gap-2 border border-[#ca5c2e] text-[#ca5c2e] hover:bg-[#ca5c2e]/10 px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition focus:outline-none shadow-xs">
          Generate from Favourites
        </button>
      </div>
    </div>

    <!-- Weekly Planner Table Card -->
    <div class="bg-white rounded-3xl border border-[#efe6dc] shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[640px]">
          <thead>
            <tr class="border-b border-[#ede4da] bg-stone-50/75 text-xs uppercase tracking-wider text-stone-500 font-bold">
              <th scope="col" class="py-3 px-4 w-20">Day</th>
              <th scope="col" class="py-3 px-4">Breakfast</th>
              <th scope="col" class="py-3 px-4">Lunch</th>
              <th scope="col" class="py-3 px-4">Dinner</th>
            </tr>
          </thead>
          <tbody id="planner-table-body" class="divide-y divide-stone-100">
            <!-- Dynamic rows populated via js/planner.js -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Integrated Shopping List Section -->
    <section class="bg-white rounded-3xl border border-[#efe6dc] shadow-sm p-6 sm:p-8 space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-lg font-bold text-stone-900 tracking-tight">Shopping List</h2>
          <p class="text-xs text-stone-500">Auto-generated ingredients for this week's meals</p>
        </div>
        <button id="clear-shopping-btn" type="button" class="text-xs font-semibold text-[#ca5c2e] hover:underline">
          Select All
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 pt-2">
        <label class="flex items-center gap-2.5 p-2 rounded-xl border border-stone-100 hover:bg-stone-50 cursor-pointer text-xs sm:text-sm text-stone-700 select-none">
          <input type="checkbox" checked class="w-4 h-4 rounded text-[#ca5c2e] accent-[#ca5c2e] focus:ring-[#ca5c2e]">
          <span class="line-through text-stone-400">Spaghetti (200g)</span>
        </label>
        <label class="flex items-center gap-2.5 p-2 rounded-xl border border-stone-100 hover:bg-stone-50 cursor-pointer text-xs sm:text-sm text-stone-700 select-none">
          <input type="checkbox" checked class="w-4 h-4 rounded text-[#ca5c2e] accent-[#ca5c2e] focus:ring-[#ca5c2e]">
          <span class="line-through text-stone-400">Pancetta (100g)</span>
        </label>
        <label class="flex items-center gap-2.5 p-2 rounded-xl border border-stone-100 hover:bg-stone-50 cursor-pointer text-xs sm:text-sm text-stone-700 select-none">
          <input type="checkbox" class="w-4 h-4 rounded text-[#ca5c2e] accent-[#ca5c2e] focus:ring-[#ca5c2e]">
          <span>Eggs (6 large)</span>
        </label>
        <label class="flex items-center gap-2.5 p-2 rounded-xl border border-stone-100 hover:bg-stone-50 cursor-pointer text-xs sm:text-sm text-stone-700 select-none">
          <input type="checkbox" class="w-4 h-4 rounded text-[#ca5c2e] accent-[#ca5c2e] focus:ring-[#ca5c2e]">
          <span>Parmesan Cheese (100g)</span>
        </label>
        <label class="flex items-center gap-2.5 p-2 rounded-xl border border-stone-100 hover:bg-stone-50 cursor-pointer text-xs sm:text-sm text-stone-700 select-none">
          <input type="checkbox" class="w-4 h-4 rounded text-[#ca5c2e] accent-[#ca5c2e] focus:ring-[#ca5c2e]">
          <span>Greek Yogurt (500g)</span>
        </label>
        <label class="flex items-center gap-2.5 p-2 rounded-xl border border-stone-100 hover:bg-stone-50 cursor-pointer text-xs sm:text-sm text-stone-700 select-none">
          <input type="checkbox" class="w-4 h-4 rounded text-[#ca5c2e] accent-[#ca5c2e] focus:ring-[#ca5c2e]">
          <span>Avocados (2 ripe)</span>
        </label>
      </div>
    </section>

  </main>

  <script type="module" src="js/navbar.js"></script>
  <script type="module" src="js/planner.js"></script>
</body>
</html>
