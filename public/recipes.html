<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes | RecipePlan</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="Browse hundreds of recipes, filter by category or cuisine, and find dishes that fit your dietary preferences.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RecipePlan">
  <meta property="og:title" content="Recipes | RecipePlan">
  <meta property="og:description" content="Browse hundreds of recipes, filter by category or cuisine, and find dishes that fit your dietary preferences.">
  <meta property="og:url" content="https://kahlen2008.github.io/webprogproject/recipes.html">
  <meta property="og:image" content="https://kahlen2008.github.io/webprogproject/images/pasta-hero.jpg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.themealdb.com" crossorigin>
  <link rel="modulepreload" href="js/navbar.js">
  <link rel="modulepreload" href="js/i18n.js">
  <link rel="modulepreload" href="js/recipes.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/utils.js">
  <link rel="modulepreload" href="js/preferences.js">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"></noscript>

  <link rel="stylesheet" href="css/tailwind.css">
  <style>
    .switch-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .switch-track {
      width: 32px;
      height: 18px;
      background-color: #e7e5e4;
      border-radius: 9999px;
      position: relative;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      display: flex;
      align-items: center;
      border: 1px solid #d6d3d1;
      flex-shrink: 0;
    }
    .switch-thumb {
      width: 12px;
      height: 12px;
      background-color: #ffffff;
      border-radius: 9999px;
      position: absolute;
      top: 2px;
      left: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .switch-input:checked + .switch-track {
      background-color: #ca5c2e;
      border-color: #b04d24;
    }
    .switch-input:checked + .switch-track .switch-thumb {
      transform: translateX(14px);
    }
    .switch-input:focus-visible + .switch-track {
      outline: 2px solid #ca5c2e;
      outline-offset: 2px;
    }
    .allergen-pill {
      height: 36px;
      padding-left: 8px;
      padding-right: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body class="bg-[#faf7f2] text-stone-800 min-h-screen flex flex-col font-sans antialiased">
  <header id="navbar" class="w-full sticky top-0 z-40 min-h-[64px] bg-[#fcf9f5]/90 border-b border-[#ede4da]"></header>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-10">
    
    <!-- Page Header & Search Bar -->
    <section class="space-y-6 max-w-2xl">
      <div class="space-y-2">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-stone-900 tracking-tight font-heading">
          Explore Recipes
        </h1>
        <p class="text-stone-600 text-sm sm:text-base font-normal">
          Search hundreds of delicious recipes or browse by your favourite categories below.
        </p>
      </div>

      <!-- Search Form -->
      <form id="search-form" class="relative max-w-xl flex items-center bg-white rounded-full shadow-sm border border-[#e8ded4] p-1.5 focus-within:ring-2 focus-within:ring-[#ca5c2e]/40 focus-within:border-[#ca5c2e] transition" role="search">
        <label for="query" class="visually-hidden">Search for a recipe, ingredient or cuisine</label>
        <input 
          id="query" 
          name="query" 
          type="search" 
          placeholder="Search for a recipe, ingredient or cuisine..." 
          class="w-full pl-5 pr-4 py-2.5 bg-transparent border-none text-stone-800 placeholder-stone-400 text-sm sm:text-base focus:outline-none font-medium"
        >
        <button type="button" id="search-clear" class="hidden w-9 h-9 shrink-0 items-center justify-center rounded-full text-stone-400 hover:text-stone-700 hover:bg-stone-100 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ca5c2e]/40" aria-label="Clear search">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button 
          type="submit" 
          id="search-btn"
          class="flex-shrink-0 w-11 h-11 bg-[#ca5c2e] hover:bg-[#b34d23] text-white rounded-full flex items-center justify-center transition shadow-sm active:scale-95 cursor-pointer"
          aria-label="Search"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </section>

    <!-- Popular Categories -->
    <section class="space-y-4" aria-labelledby="categories-heading">
      <h2 id="categories-heading" class="visually-hidden">Popular categories</h2>
      <!-- Round photos with the name underneath; swipe sideways on phones and small tablets, one even row from 768px up -->
      <div class="category-row flex gap-3 overflow-x-auto -mx-4 px-4 sm:-mx-6 sm:px-6 py-2 md:mx-0 md:px-0 md:grid md:grid-cols-7 md:gap-4 md:overflow-visible">
        <!-- Category: Breakfast (pairs with the planner's Breakfast slot) -->
        <button type="button" class="category-chip group flex flex-col items-center gap-2.5 shrink-0 w-[84px] md:w-auto py-1 rounded-2xl focus:outline-none" data-category="Breakfast">
          <div class="category-circle w-[72px] h-[72px] md:w-20 md:h-20 lg:w-[88px] lg:h-[88px] rounded-full overflow-hidden bg-stone-100">
            <img src="images/cat-breakfast.jpg" alt="" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition-colors">Breakfast</span>
        </button>

        <!-- Category: Chicken -->
        <button type="button" class="category-chip group flex flex-col items-center gap-2.5 shrink-0 w-[84px] md:w-auto py-1 rounded-2xl focus:outline-none" data-category="Chicken">
          <div class="category-circle w-[72px] h-[72px] md:w-20 md:h-20 lg:w-[88px] lg:h-[88px] rounded-full overflow-hidden bg-stone-100">
            <img src="images/cat-chicken.webp" alt="" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition-colors">Chicken</span>
        </button>

        <!-- Category: Beef -->
        <button type="button" class="category-chip group flex flex-col items-center gap-2.5 shrink-0 w-[84px] md:w-auto py-1 rounded-2xl focus:outline-none" data-category="Beef">
          <div class="category-circle w-[72px] h-[72px] md:w-20 md:h-20 lg:w-[88px] lg:h-[88px] rounded-full overflow-hidden bg-stone-100">
            <img src="images/cat-beef.webp" alt="" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition-colors">Beef</span>
        </button>

        <!-- Category: Pasta -->
        <button type="button" class="category-chip group flex flex-col items-center gap-2.5 shrink-0 w-[84px] md:w-auto py-1 rounded-2xl focus:outline-none" data-category="Pasta">
          <div class="category-circle w-[72px] h-[72px] md:w-20 md:h-20 lg:w-[88px] lg:h-[88px] rounded-full overflow-hidden bg-stone-100">
            <img src="images/pasta-hero.webp" alt="" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition-colors">Pasta</span>
        </button>

        <!-- Category: Vegetarian -->
        <button type="button" class="category-chip group flex flex-col items-center gap-2.5 shrink-0 w-[84px] md:w-auto py-1 rounded-2xl focus:outline-none" data-category="Vegetarian">
          <div class="category-circle w-[72px] h-[72px] md:w-20 md:h-20 lg:w-[88px] lg:h-[88px] rounded-full overflow-hidden bg-stone-100">
            <img src="images/cat-vegetarian.webp" alt="" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition-colors">Vegetarian</span>
        </button>

        <!-- Category: Dessert -->
        <button type="button" class="category-chip group flex flex-col items-center gap-2.5 shrink-0 w-[84px] md:w-auto py-1 rounded-2xl focus:outline-none" data-category="Dessert">
          <div class="category-circle w-[72px] h-[72px] md:w-20 md:h-20 lg:w-[88px] lg:h-[88px] rounded-full overflow-hidden bg-stone-100">
            <img src="images/cat-dessert.webp" alt="" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition-colors">Dessert</span>
        </button>

        <!-- Category: Seafood -->
        <button type="button" class="category-chip group flex flex-col items-center gap-2.5 shrink-0 w-[84px] md:w-auto py-1 rounded-2xl focus:outline-none" data-category="Seafood">
          <div class="category-circle w-[72px] h-[72px] md:w-20 md:h-20 lg:w-[88px] lg:h-[88px] rounded-full overflow-hidden bg-stone-100">
            <img src="images/cat-seafood.webp" alt="" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition-colors">Seafood</span>
        </button>
      </div>
    </section>

    <!-- Latest / Search Results Grid Section -->
    <section id="recipes-section" class="space-y-5 scroll-mt-20">
      <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-[#ede4da]">
        <h2 id="recipes-section-title" class="text-xl sm:text-2xl font-bold text-stone-900 tracking-tight font-heading">Latest Recipes</h2>
        <div class="flex items-center gap-2.5 sm:gap-3 flex-wrap">
          <!-- Shown to logged-out visitors: preferences only apply after logging in -->
          <a id="personalise-note" href="login.html?redirect=recipes.html" class="hidden items-center gap-1.5 h-9 px-3.5 rounded-full bg-[#fbf2ec] text-xs sm:text-sm font-semibold text-[#a04e28] hover:bg-[#f7e4d8] transition focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ca5c2e]/40">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            Log in to personalise recipes
          </a>
          <!-- Cuisine filter (Person 4): a custom dropdown, since a native <select> list can't be styled -->
          <div id="cuisine-picker" class="rp-cuisine">
            <button id="cuisine-trigger" type="button" class="rp-pill rp-cuisine-trigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="cuisine-panel">
              <span class="rp-pill-icon">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="10"></circle>
                  <line x1="2" y1="12" x2="22" y2="12"></line>
                  <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
              </span>
              <span class="visually-hidden">Cuisine: </span>
              <span id="cuisine-trigger-label" class="rp-cuisine-label">All cuisines</span>
              <svg class="rp-cuisine-chevron" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <button id="cuisine-clear" type="button" class="rp-cuisine-clear" aria-label="Remove cuisine filter" title="Remove cuisine filter" hidden>
              <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" viewBox="0 0 24 24" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div id="cuisine-panel" class="rp-cuisine-panel" hidden>
              <div class="rp-cuisine-search">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input id="cuisine-search" type="text" placeholder="Search cuisines" autocomplete="off" spellcheck="false"
                  role="combobox" aria-expanded="true" aria-controls="cuisine-list" aria-autocomplete="list" aria-label="Search cuisines">
              </div>
              <ul id="cuisine-list" class="rp-cuisine-list" role="listbox" aria-label="Cuisines"></ul>
            </div>
          </div>

          <!-- Clear filters button -->
          <button
            id="clear-filters-btn"
            type="button"
            class="rp-pill rp-clear-filters hidden"
          >
            <span class="rp-pill-icon">
              <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"></path><polyline points="3 3 3 9 9 9"></polyline></svg>
            </span>
            <span>Clear filters</span>
          </button>

          <div id="hide-flagged-wrap" class="hidden items-center">
            <label class="allergen-pill rp-pill-hover group rounded-full bg-white border border-[#ede4da] hover:border-[#ca5c2e]/40 shadow-2xs transition-all duration-200 cursor-pointer select-none">
              <span class="w-6 h-6 rounded-full bg-[#fbf2ec] text-[#ca5c2e] flex items-center justify-center shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
              </span>
              <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-stone-900 transition-colors leading-none">Hide allergen recipes</span>
              <span class="relative inline-flex items-center shrink-0">
                <input id="hide-flagged-toggle" type="checkbox" class="switch-input">
                <span class="switch-track" aria-hidden="true">
                  <span class="switch-thumb"></span>
                </span>
              </span>
            </label>
          </div>
        </div>
      </div>

      <div id="results-message" class="hidden text-sm font-medium text-stone-500" aria-live="polite"></div>
      
      <!-- Recipe Cards Grid -->
      <ul id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 list-none p-0 m-0 min-h-[680px] content-start"></ul>

      <!-- Page controls under the grid (filled by js/recipes.js) -->
      <nav id="results-pagination" aria-label="Recipe pages" class="hidden pt-4"></nav>
    </section>
  </main>

  <!-- Global Footer (rendered by js/navbar.js) -->
  <footer id="site-footer"></footer>

  <script type="module" src="js/navbar.js"></script>
  <script type="module" src="js/recipes.js"></script>
</body>
</html>
