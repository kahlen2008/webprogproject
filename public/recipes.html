<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes | RecipePlan</title>
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="Browse hundreds of recipes, filter by category or cuisine, and find dishes that fit your dietary preferences.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.themealdb.com" crossorigin>
  <link rel="modulepreload" href="js/navbar.js">
  <link rel="modulepreload" href="js/i18n.js">
  <link rel="modulepreload" href="js/recipes.js">
  <link rel="modulepreload" href="js/api.js">
  <link rel="modulepreload" href="js/utils.js">
  <link rel="modulepreload" href="js/preferences.js">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"></noscript>

  <link rel="stylesheet" href="css/tailwind.css">
  <style>
    .switch-input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }
    .switch-track {
      width: 32px;
      height: 18px;
      background-color: #e7e5e4;
      border-radius: 9999px;
      position: relative;
      transition: background-color 0.2s ease, border-color 0.2s ease;
      display: flex;
      align-items: center;
      border: 1px solid #d6d3d1;
      flex-shrink: 0;
    }
    .switch-thumb {
      width: 12px;
      height: 12px;
      background-color: #ffffff;
      border-radius: 9999px;
      position: absolute;
      top: 2px;
      left: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .switch-input:checked + .switch-track {
      background-color: #ca5c2e;
      border-color: #b04d24;
    }
    .switch-input:checked + .switch-track .switch-thumb {
      transform: translateX(14px);
    }
    .switch-input:focus-visible + .switch-track {
      outline: 2px solid #ca5c2e;
      outline-offset: 2px;
    }
    .allergen-pill {
      height: 36px;
      padding-left: 8px;
      padding-right: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body class="bg-[#faf7f2] text-stone-800 min-h-screen flex flex-col font-sans antialiased">
  <header id="navbar" class="w-full sticky top-0 z-40 min-h-[64px] bg-[#fcf9f5]/90 border-b border-[#ede4da]"></header>

  <main class="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-10">
    
    <!-- Page Header & Search Bar -->
    <section class="space-y-6 max-w-2xl">
      <div class="space-y-2">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-stone-900 tracking-tight font-heading">
          Explore Recipes
        </h1>
        <p class="text-stone-600 text-sm sm:text-base font-normal">
          Search hundreds of delicious recipes or browse by your favourite categories below.
        </p>
      </div>

      <!-- Search Form -->
      <form id="search-form" class="relative max-w-xl flex items-center bg-white rounded-full shadow-sm border border-[#e8ded4] p-1.5 focus-within:ring-2 focus-within:ring-[#ca5c2e]/40 focus-within:border-[#ca5c2e] transition" role="search">
        <label for="query" class="visually-hidden">Search for a recipe, ingredient or cuisine</label>
        <input 
          id="query" 
          name="query" 
          type="search" 
          placeholder="Search for a recipe, ingredient or cuisine..." 
          class="w-full pl-5 pr-4 py-2.5 bg-transparent border-none text-stone-800 placeholder-stone-400 text-sm sm:text-base focus:outline-none font-medium"
        >
        <button 
          type="submit" 
          id="search-btn"
          class="flex-shrink-0 w-11 h-11 bg-[#ca5c2e] hover:bg-[#b34d23] text-white rounded-full flex items-center justify-center transition shadow-sm active:scale-95 cursor-pointer"
          aria-label="Search"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </form>
    </section>

    <!-- Popular Categories -->
    <section class="space-y-4">
      <div class="flex items-end justify-between gap-3">
        <div>
          <h2 class="text-xl sm:text-2xl font-bold text-stone-900 tracking-tight font-heading">Popular Categories</h2>
          <p class="text-xs sm:text-sm text-stone-500 mt-0.5">Tap a category to filter the recipes below.</p>
        </div>
      </div>
      <div class="grid grid-cols-3 sm:grid-cols-6 gap-3 sm:gap-4">
        <!-- Category: Chicken -->
        <button type="button" class="category-chip flex flex-col items-center gap-2.5 px-2 py-4 rounded-2xl bg-white border border-[#ede4da] shadow-2xs hover:border-[#ca5c2e]/50 hover:shadow-sm hover:-translate-y-0.5 group focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ca5c2e]/40 transition duration-200" data-category="Chicken">
          <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden border-2 border-white shadow-sm ring-1 ring-[#ede4da] group-hover:scale-105 transition duration-300">
            <img src="images/cat-chicken.webp" alt="Chicken" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition">Chicken</span>
        </button>

        <!-- Category: Beef -->
        <button type="button" class="category-chip flex flex-col items-center gap-2.5 px-2 py-4 rounded-2xl bg-white border border-[#ede4da] shadow-2xs hover:border-[#ca5c2e]/50 hover:shadow-sm hover:-translate-y-0.5 group focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ca5c2e]/40 transition duration-200" data-category="Beef">
          <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden border-2 border-white shadow-sm ring-1 ring-[#ede4da] group-hover:scale-105 transition duration-300">
            <img src="images/cat-beef.webp" alt="Beef" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition">Beef</span>
        </button>

        <!-- Category: Pasta -->
        <button type="button" class="category-chip flex flex-col items-center gap-2.5 px-2 py-4 rounded-2xl bg-white border border-[#ede4da] shadow-2xs hover:border-[#ca5c2e]/50 hover:shadow-sm hover:-translate-y-0.5 group focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ca5c2e]/40 transition duration-200" data-category="Pasta">
          <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden border-2 border-white shadow-sm ring-1 ring-[#ede4da] group-hover:scale-105 transition duration-300">
            <img src="images/pasta-hero.webp" alt="Pasta" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition">Pasta</span>
        </button>

        <!-- Category: Vegetarian -->
        <button type="button" class="category-chip flex flex-col items-center gap-2.5 px-2 py-4 rounded-2xl bg-white border border-[#ede4da] shadow-2xs hover:border-[#ca5c2e]/50 hover:shadow-sm hover:-translate-y-0.5 group focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ca5c2e]/40 transition duration-200" data-category="Vegetarian">
          <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden border-2 border-white shadow-sm ring-1 ring-[#ede4da] group-hover:scale-105 transition duration-300">
            <img src="images/cat-vegetarian.webp" alt="Vegetarian" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition">Vegetarian</span>
        </button>

        <!-- Category: Dessert -->
        <button type="button" class="category-chip flex flex-col items-center gap-2.5 px-2 py-4 rounded-2xl bg-white border border-[#ede4da] shadow-2xs hover:border-[#ca5c2e]/50 hover:shadow-sm hover:-translate-y-0.5 group focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ca5c2e]/40 transition duration-200" data-category="Dessert">
          <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden border-2 border-white shadow-sm ring-1 ring-[#ede4da] group-hover:scale-105 transition duration-300">
            <img src="images/cat-dessert.webp" alt="Dessert" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition">Dessert</span>
        </button>

        <!-- Category: Seafood -->
        <button type="button" class="category-chip flex flex-col items-center gap-2.5 px-2 py-4 rounded-2xl bg-white border border-[#ede4da] shadow-2xs hover:border-[#ca5c2e]/50 hover:shadow-sm hover:-translate-y-0.5 group focus:outline-none focus-visible:ring-2 focus-visible:ring-[#ca5c2e]/40 transition duration-200" data-category="Seafood">
          <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full overflow-hidden border-2 border-white shadow-sm ring-1 ring-[#ede4da] group-hover:scale-105 transition duration-300">
            <img src="images/cat-seafood.webp" alt="Seafood" width="96" height="96" decoding="async" class="w-full h-full object-cover">
          </div>
          <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-[#ca5c2e] transition">Seafood</span>
        </button>
      </div>
    </section>

    <!-- Latest / Search Results Grid Section -->
    <section id="recipes-section" class="space-y-5 scroll-mt-20">
      <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-[#ede4da]">
        <h2 id="recipes-section-title" class="text-xl sm:text-2xl font-bold text-stone-900 tracking-tight font-heading">Latest Recipes</h2>
        <div class="flex items-center gap-2.5 sm:gap-3 flex-wrap">
          <div id="hide-flagged-wrap" class="hidden items-center">
            <label class="allergen-pill group rounded-full bg-white border border-[#ede4da] hover:border-[#ca5c2e]/40 shadow-2xs transition-all duration-200 cursor-pointer select-none">
              <span class="w-6 h-6 rounded-full bg-[#fbf2ec] text-[#ca5c2e] flex items-center justify-center shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
              </span>
              <span class="text-xs sm:text-sm font-semibold text-stone-700 group-hover:text-stone-900 transition-colors leading-none">Hide allergen recipes</span>
              <span class="relative inline-flex items-center shrink-0 ml-1.5 sm:ml-2">
                <input id="hide-flagged-toggle" type="checkbox" class="switch-input">
                <span class="switch-track" aria-hidden="true">
                  <span class="switch-thumb"></span>
                </span>
              </span>
            </label>
          </div>

          <button id="view-more-btn" type="button" class="group inline-flex items-center gap-1.5 h-9 px-3.5 text-xs sm:text-sm font-semibold text-[#ca5c2e] hover:text-white bg-white hover:bg-[#ca5c2e] border border-[#ca5c2e]/30 hover:border-[#ca5c2e] rounded-full transition-all duration-200 shadow-2xs cursor-pointer active:scale-95 leading-none">
            <span>View more</span>
            <span class="transition-transform duration-200 group-hover:translate-x-0.5" aria-hidden="true">&rarr;</span>
          </button>
        </div>
      </div>

      <div id="results-message" class="hidden text-sm font-medium text-stone-500" aria-live="polite"></div>
      
      <!-- Recipe Cards Grid -->
      <ul id="results" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 list-none p-0 m-0 min-h-[680px] content-start"></ul>
    </section>
  </main>

  <!-- Global Footer (rendered by js/navbar.js) -->
  <footer id="site-footer"></footer>

  <script type="module" src="js/navbar.js"></script>
  <script type="module" src="js/recipes.js"></script>
</body>
</html>
